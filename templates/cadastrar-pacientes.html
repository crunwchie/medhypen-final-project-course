}

          <div class="collapse navbar-collapse" id="navbarNavDropdown">

              <li class="nav-item"><!-- botão que leva para a página sobre -->

    <div class="row">
        <div class="container w-50 p-5 container-center">
          <div class="text text-center text-dark">
          <h1>CADASTRO DO PACIENTE</h1>
                <form action="/cadastrar-pacientes" method="post">
                    <div class="mb-3 p-2">
                        <input type="text" class="form-control" name="nome" placeholder="Nome"/>
                    </div>
                    <div class="mb-3 p-2">
                        <input type="text" class="form-control" name="endereco" placeholder="Endereço"/>
                    </div>
                    <div class="mb-3 p-2">
                        <input type="tel" class="form-control" name="telefone" placeholder="Telefone"/>
                        </div>
                    <div class="mb-3 p-2">
                        <input type="date" class="form-control" name="data_nascimento" placeholder="Data de Nascimento"/>
                    </div>
                    <div class="mb-3 p-2">
                        <input type="text" class="form-control" name="contato_emergencia" placeholder="Contato de Emergência"/>
                    </div>
                    <div class="mb-3 p-2">
                        <input type="text" class="form-control" name="cpf" placeholder="CPF"/>
                    </div>
                    <div class="mb-3 p-2">
                        <input type="text" class="form-control" name="carteirinha_sus" placeholder="Número da Carteirinha"/>
                    </div>
                      <!--Envia os dados para o banco de dados-->
                    <button class="btn btn-primary" type="submit">Enviar</button>
                </form>
            </div> 
        </div> 
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
