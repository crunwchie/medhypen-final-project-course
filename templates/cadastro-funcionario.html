<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MEDHYPEN - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <style>
      body {
          background-image: url('../static/fundo.png');
          background-size: cover;
          background-repeat: no-repeat;
}
  </style>
      <div class="container w-50 container-center">
        <!--imagem usando python-->
        <div class="d-flex justify-content-around">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="logo" width="200" height="200">
      </div>
      </div>
    <div class="row">
      <div class="container w-50 p-5 container-center">
        <div class="text text-center">
        <h1>CADASTRO</h1>
      </div>

    <form action="/cadastrar-funcionarios" method="post">
        <!--formulario de cadastro para funcionários-->

      <div class="mb-3 p-2 ">
        <label for="nome" class="form-label"></label>
        <input type="text" class="form-control" name="nome" placeholder="Nome completo" required>
      </div><!--nome-->

      <div class="mb-3 p-2 ">
        <label for="email" class="form-label"></label>
        <input type="email" class="form-control" name="email" placeholder="Usuário" required>
      </div><!--email-->

      <div class="mb-3 p-2 ">
        <label for="date" class="form-label"></label>
        <input type="date" class="form-control" name="data_nascimento" placeholder="Data de Nascimento" required>
      </div>

      <div class="mb-3 p-2 ">
        <label for="cpf" class="form-label"></label>
        <input type="tel" class="form-control" name="cpf" placeholder="CPF" required>
      </div><!--CPF-->

      <div class="mb-3 p-2 ">
        <label for="numero" class="form-label"></label>
        <input type="tel" class="form-control" name="numero" placeholder="Telefone" required>
      </div><!--telefone-->

      <div class="mb-3 p-2 ">
        <label for="endereco" class="form-label"></label>
        <input type="text" class="form-control" name="endereco" placeholder="Endereço" required>
      </div><!--Endereço-->

      <div class="mb-3 p-2 ">
        <label for="id_funcionario" class="form-label"></label>
        <input type="tel" class="form-control" name="CIP" aria-describedby="emailHelp" placeholder="CIP ou PIS" required>
      </div><!--CIP OU PIS-->

      <div class="mb-3 p-2 ">
        <label for="cargo" class="form-label"></label>
        <input type="text" class="form-control" name="cargo" placeholder="Cargo" required>
      </div>

      <div class="mb-3 p-2">
        <label for="senha" class="form-label"></label>
        <input type="password" class="form-control" name="senha" placeholder="Senha" required>
      </div><!--senha e confirmação de senha (if)-->

      <div class="mb-3 p-2">
        <label for="comfirmar" class="form-label"></label>
        <input type="password" class="form-control" name="comfirmar_senha" placeholder="Confirmar senha" required>
      </div>

      <div class="mb-3">
        <div id="emailHelp" class="form-text text-center">PERGUNTAS DE SEGURANÇA.</div>
        <label for="pergunta1" class="form-label"></label>
        <input type="text" class="form-control" name="pergunta1" placeholder="Nome de solteiro da sua mãe" required>
      </div>

      <div class="mb-3">
        <label for="pergunta2" class="form-label"></label>
        <input type="text" class="form-control" name="pergunta2" placeholder="Cidade que você nasceu" required>
      </div>

      <div class="mb-3">
        <label for="pergunta3" class="form-label"></label>
        <input type="text" class="form-control" name="pergunta3" placeholder="Nome da sua escola do ensino médio" required>
      </div>
     
      <!-- Botão para realizar o cadastro-->
       <div class="d-flex justify-content-around p-5">
        <button class="btn btn-primary" type="submit">
          Cadastrar
        </button>
      </div>
  </div>
    </form>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
